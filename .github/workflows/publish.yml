name: Publish

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release -v normal -p:Version=${{ github.event.release.tag_name }} csdl/csdl.csproj

      - name: Pack (Beta)
        run: dotnet pack -c Release --no-build -o ./packages -p:PackageVersion=${{ github.event.release.tag_name }}-beta csdl/csdl.csproj
        if: "github.event.release.prerelease"

      - name: Pack (Stable)
        run: dotnet pack -c Release --no-build -o ./packages -p:PackageVersion=${{ github.event.release.tag_name }} csdl/csdl.csproj
        if: "!github.event.release.prerelease"

      - name: Publish
        run: dotnet nuget push -s https://api.nuget.org/v3/index.json --skip-duplicate -k ${{ secrets.NUGET_KEY }} ./packages/*.nupkg